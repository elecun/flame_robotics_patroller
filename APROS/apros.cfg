[SYSTEM]
system_name = APROS
version = 1.0.0
log_level = INFO

[PLATFORM]
robot_model = iae_patrol_v2
robot_id = patrol_robot_02
ip = 0.0.0.0
default_lat = 34.824628
default_lon = 127.661044
default_alt = 45.0
#devices = mobile_drive_s1, vlp-16, ouster-sr-128, baumer_incline, basler_gige_camera, synerex_syn2000, synerex_syn3100, fluke_sv600, xsens_mti_630r, telescopic_mast
devices = mobile_drive_s1, vlp-16, xsens_mti_630r, basler_gige_camera
plugins = 

[NETWORK]
host = 0.0.0.0
port = 8080

[basler_gige_camera]
ip = 192.168.10.3
w_resolution = 2448
h_resolution = 2048
fps = 10
status = fps, timestamp, resolution
enable = true

[baumer_incline]
can_channel = 1
can_bitrate = 500000
node_id = 1
enable = true
status = channel, node_id, tilt_x, tilt_z, temperature

[mobile_drive_s1]
can_channel = 0
min_velocity = 0.5
max_velocity = 3.5
max_steering_angle = 35.0
lookahead_distance = 5.0
predict_time = 3.0
corridor_boundary = 3.0
auto_mode_interval_ms = 20
control_freq = 10
enable = true
# Remove a name from status to hide that monitoring value.
#status = channel, drive_mode, gear, speed, steer_angle, brake_pressure_cmd, left_turn_light, right_turn_light, head_light, brake_light, clamping_brake_status, bms_battery_soc, emergency_button, head_light_actual, brake_light_actual
status = drive_mode, gear, speed, steer_angle, head_light, brake_light, clamping_brake_status, bms_battery_soc, emergency_button, head_light_actual, brake_light_actual

[ackermann_dwa_local_planner]
# DWA Prediction & Grid Sampling
predict_time = 3.0          # Forward trajectory prediction horizon (sec)
dt = 0.1                    # Simulation time step (sec)
v_samples = 10              # Linear velocity candidate sampling resolution
steer_samples = 20          # Steering angle candidate sampling resolution
lookahead_distance = 2.5    # Reference path target lookahead distance (m)

# Kinematic & Motion Limits
min_velocity = 0.5          # Minimum forward speed (km/h)
max_velocity = 2.0          # Maximum forward speed (km/h)
max_accel = 1.0             # Maximum linear acceleration (m/s^2)
min_steer_angle = -30.0     # Minimum steering angle (deg)
max_steer_angle = 30.0      # Maximum steering angle (deg)
max_steer_rate = 30.0       # Maximum steering angular velocity (deg/s)

# Safety Inflation Margin
inflation_radius = 0.15     # Footprint OBB safety inflation margin (m)

# Cost Function Weights
path_distance_weight = 0.8  # Path/heading error tracking weight
obstacle_weight = 0.7       # Obstacle clearance weight
velocity_weight = 1.0       # Target velocity tracking weight
steer_smoothness_weight = 0.5 # Steering angle change smoothness weight
corridor_weight = 2.0       # Corridor boundary constraint weight

[iae_patrol_v2]
global_planner = cubic_spline_global_planner
local_planner = mppi_local_planner

[mppi_local_planner]
samples = 96
horizon = 36
iterations = 2
temperature = 1.0
steering_noise = 0.16
velocity_noise = 0.22

[vlp-16]
ip = 192.168.100.3
port = 2368
min_angle = -90.0
max_angle = 90.0
ground_removal = patchworkpp
enable = true
#status = ip, port, packet_count, last_packet_time, last_point_count
status = last_point_count

[patchworkpp]
czm_num_zones = 4
num_sectors = 16
max_r = 10.0
min_r = 0.5
th_dist = 0.09
max_iter = 4
num_lpr = 20
th_seeds = 0.1
uprightness_thr = 0.707

[ouster-sr-128]
ip = 192.168.100.12
port = 7502
min_angle = -180.0
max_angle = 180.0
enable = true
status = ip, port, last_point_count

[telescopic_mast]
port = /dev/ttyUSB1
baudrate = 9600
parity = N
stopbits = 2
bus_address = 1
stop_trig_bound = 15.0
enable = true
status = current_height_mm, target_height_mm, mast_action_state, move_height_active

[synerex_syn2000]
port = /dev/ttyS4
baudrate = 115200
utc_offset = 9
update_interval_sec = 0.2
ws_host = 127.0.0.1
ws_port = 18765
enable = true
status = latitude, longitude, heading, fix_quality, satellites, new_updated

[synerex_syn3100]
port = /dev/ttyACM1
baudrate = 9600
update_interval_sec = 0.2
enable = false
status = latitude, longitude, heading, fix_quality, satellites, new_updated

[fluke_sv600]
host = 192.168.100.20
port = 80
username = admin
password =
frequency_ranges = 20000-28000
image_output_dir = datalog/fluke_sv600
stream_path = /api/v1/stream
enable = false
status = frame_count, frequency_ranges

[xsens_mti_630r]
# Select exactly one transport: rs232 or can.
interface = rs232
port = /dev/serial/by-id/usb-Xsens_MTi_USB_Converter_DB9YBFQF-if00-port0
baudrate = 115200
can_channel = 0
can_bitrate = 500000
# Optional CAN arbitration ID filter (decimal or 0x-prefixed hex).
can_message_id =
enable = true
#status = interface, port, baudrate, sample_count, timestamp, roll, pitch, yaw, acceleration, rate_of_turn
status = roll, pitch, yaw, acceleration, rate_of_turn

[DATA_LOGGER]
base_dir = /home/iae/dev/flame_robotics_patroller/APROS/datalog
record_interval_ms = 50
enable_camera = true
enable_vlp16 = true
enable_ouster = true
enable_can = true
enable_incline = true
enable_rtk = true

