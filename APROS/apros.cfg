[SYSTEM]
system_name = APROS
version = 1.0.0
log_level = INFO

[PLATFORM]
robot_model = iae_patrol_v1
robot_id = patrol_robot_01
ip = 192.168.0.252
devices = mobile_drive_s1, vlp-16, ouster-sr-128, baumer_incline, basler_gige_camera, synerex_rtk, telescopic_mast
plugins = 

[NETWORK]
host = 0.0.0.0
port = 8080

[basler_gige_camera]
ip = 192.168.100.13
fps = 15
enable = true

[baumer_incline]
can_channel = 1
can_bitrate = 500000
node_id = 1
enable = true

[mobile_drive_s1]
can_channel = 0
min_velocity = -1.0
max_velocity = 1.0
max_steering_angle = 30.0
lookahead_distance = 3.0
predict_time = 3.0
corridor_boundary = 2.5
auto_mode_interval_ms = 20
control_freq = 10
enable = true

[iae_patrol_v1]
global_planner = cubic_spline_global_planner
local_planner = ackermann_dwa_local_planner

[vlp-16]
ip = 192.168.101.10
port = 2368
min_angle = -90.0
max_angle = 90.0
ground_removal = patchworkpp
enable = true

[patchworkpp]
czm_num_zones = 4
num_sectors = 16
max_r = 10.0
min_r = 0.5
th_dist = 0.12
max_iter = 3
num_lpr = 20
th_seeds = 0.1
uprightness_thr = 0.707

[ouster-sr-128]
ip = 192.168.100.12
port = 7502
min_angle = -180.0
max_angle = 180.0
enable = true

[telescopic_mast]
port = /dev/ttyUSB1
baudrate = 9600
parity = N
stopbits = 2
bus_address = 1
enable = true

[synerex_rtk]
port = /dev/ttyACM0
baudrate = 9600
utc_offset = 9
update_interval_sec = 1.0
ws_host = 127.0.0.1
ws_port = 18765
default_lat = 34.7971754
default_lon = 127.6607499
default_alt = 45.0
enable = true

[DATA_LOGGER]
base_dir = /home/iae/dev/flame_robotics_patroller/APROS/datalog
record_interval_ms = 50
enable_camera = true
enable_vlp16 = true
enable_ouster = true
enable_can = true
enable_incline = true
enable_rtk = true

