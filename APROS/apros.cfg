[SYSTEM]
system_name = APROS
version = 1.0.0
log_level = INFO

[PLATFORM]
robot_model = iae_patrol_v2
robot_id = patrol_robot_02
ip = 0.0.0.0
default_lat = 34.824628
default_lon = 127.661044
default_alt = 45.0
#devices = mobile_drive_s1, vlp-16, ouster-sr-128, baumer_incline, basler_gige_camera, synerex_syn2000, synerex_syn3100, fluke_sv600, xsens_mti_630r, telescopic_mast
devices = mobile_drive_s1, vlp-16, xsens_mti_630r, basler_gige_camera, fluke_sv600, synerex_syn3100, ouster-sr-128, des_control
plugins = 

[NETWORK]
host = 0.0.0.0
port = 8080

[des_control]
end_point = tcp://127.0.0.1:5590
enable = true

[basler_gige_camera]
ip = 192.168.10.3
w_resolution = 2448
h_resolution = 2048
fps = 10
status = fps, timestamp, resolution
enable = true

[baumer_incline]
can_channel = 1
can_bitrate = 500000
node_id = 1
enable = true
status = channel, node_id, tilt_x, tilt_z, temperature

[mobile_drive_s1]
can_channel = 0
min_velocity = 0.0
max_velocity = 4.0
max_steering_angle = 30.0
lookahead_distance = 5.0
predict_time = 3.0
corridor_boundary = 3.0
auto_mode_interval_ms = 20
control_freq = 10
enable = true
# Remove a name from status to hide that monitoring value.
#status = channel, drive_mode, gear, speed, steer_angle, brake_pressure_cmd, left_turn_light, right_turn_light, head_light, brake_light, clamping_brake_status, bms_battery_soc, emergency_button, head_light_actual, brake_light_actual
status = drive_mode, gear, speed, steer_angle, head_light, brake_light, clamping_brake_status, bms_battery_soc, emergency_button, head_light_actual, brake_light_actual

[ackermann_dwa_local_planner]
# DWA Prediction & Grid Sampling
predict_time = 3.0          # Forward trajectory prediction horizon (sec)
dt = 0.1                    # Simulation time step (sec)
v_samples = 10              # Linear velocity candidate sampling resolution
steer_samples = 20          # Steering angle candidate sampling resolution
lookahead_distance = 3.5    # Reference path target lookahead distance (m)

# Kinematic & Motion Limits
min_velocity = 0.5          # Minimum forward speed (km/h)
max_velocity = 2.0          # Maximum forward speed (km/h)
max_accel = 1.0             # Maximum linear acceleration (m/s^2)
min_steer_angle = -30.0     # Minimum steering angle (deg)
max_steer_angle = 30.0      # Maximum steering angle (deg)
max_steer_rate = 15.0       # Maximum steering angular velocity (deg/s)

# Safety Inflation Margin
inflation_radius = 0.15     # Footprint OBB safety inflation margin (m)

# Cost Function Weights
path_distance_weight = 0.8  # Path/heading error tracking weight
obstacle_weight = 0.7       # Obstacle clearance weight
velocity_weight = 1.0       # Target velocity tracking weight
steer_smoothness_weight = 0.5 # Steering angle change smoothness weight
corridor_weight = 2.0       # Corridor boundary constraint weight

[iae_patrol_v2]
global_planner = cubic_spline_global_planner
local_planner = mppi_local_planner

[mppi_local_planner]
# 로봇 현재 위치에서 이 거리(m)에 가장 가까운 전역 경로점을 전방 목표점(target_idx)으로 선택하고, Viser에 렌더링할 로컬 최적 경로를 이 거리 부근까지 표시함.
lookahead_distance = 4.0
# MPPI 예측 궤적 적분 시 사용하는 기본 단위 시간 간격(초, delta_t). 알고리즘 내부에서 lookahead 거리와 horizon에 맞춰 rollout_dt가 계산됨.
dt = 0.1
# MPPI 주행 속도 하한 및 상한(km/h). [mobile_drive_s1]의 허용 속도 범위 내에서 설정하며, 알고리즘 내부에서는 m/s로 변환하여 사용함.
min_velocity_kmh = 1.0
max_velocity_kmh = 4.0
# 로봇 앞바퀴 조향각 하한 및 상한(도, -30.0 ~ +30.0도 범위로 제한). -: 우회전(CW), +: 좌회전(CCW). 알고리즘 내부에서는 라디안(rad)으로 변환하여 연산함.
min_steer_angle_deg = -32.0
max_steer_angle_deg = 32.0
# 후보 궤적의 인접 스텝 및 실제 제어 명령 사이에서 허용할 최대 조향각속도(도/초, 기본값 15.0도/초). 알고리즘 내부에서는 라디안/초(rad/s)로 변환하여 하드 클램핑함.
max_steer_rate_deg_s = 20.0
# 장애물 충돌 판정 시 로봇 차체 외곽(Bounding Box)에 추가하는 안전 여유 반경(m).
inflation_radius = 0.2
# 매 MPPI 반복(iteration)마다 샘플링하여 평가하는 후보 제어 궤적의 개수(K).
samples = 96
# 후보 궤적 하나를 미래로 예측하는 시간 스텝 수(T). 총 예측 시간은 horizon * rollout_dt 초.
horizon = 50
# 한 제어 주기(control_loop) 안에서 후보 궤적을 샘플링하고 명목 제어열(nominal sequence)을 반복 갱신하는 횟수.
iterations = 2
# 후보 궤적의 비용(cost)을 소프트맥스 가중치로 변환할 때 사용하는 온도 파라메터(lambda). 낮을수록 최소 비용 궤적에 가중치가 집중됨.
temperature = 1.0
# 후보 궤적 생성 시 명목 조향각에 더하는 가우시안 탐색 노이즈의 표준편차(도). 알고리즘 내부에서는 라디안(0.16 rad ≈ 9.17도)으로 변환하여 샘플링함.
steering_noise_deg = 9.167324722
# 후보 궤적 생성 시 명목 속도에 더하는 가우시안 탐색 노이즈의 표준편차(m/s).
velocity_noise = 0.08
# MPPI 초기화 시 명목 속도열(nominal_v)의 초기 기준 속도(km/h). max_velocity_kmh 이하로 자동 제한됨.
initial_velocity_kmh = 2.0
# 한 번의 로컬 플래닝 주기에서 충돌 및 이격 거리를 평가할 라이다 장애물 포인트의 최대 개수.
obstacle_limit = 192
# 장애물 탐색 반경(lookahead_distance + 로봇 길이의 절반)에 추가로 더하는 여유 거리(m).
obstacle_range_margin = 1.0
# 전역 참조 경로(reference path)와 예측 후보 궤적 사이의 위치 오차(횡방향/종방향 거리) 비용 가중치.
path_distance_weight = 2.8
# 전역 참조 경로의 진행 방향(heading)과 예측 후보 궤적의 헤딩 각도 오차(rad) 비용 가중치.
heading_weight = 1.6
# 장애물과의 이격 거리(clearance)가 가까울수록 반비례하여 부과되는 장애물 회피 비용 가중치.
clearance_weight = 0.7
# 로봇 안전 영역과 장애물이 겹쳤을 때 부과하는 충돌 페널티 비용. 최적 궤적 비용이 이 값 이상이면 로봇은 정지(0 m/s)함.
collision_cost = 10000.0
# 예측 후보 속도와 참조 경로의 목표 속도(target_speed) 사이의 속도 추종 오차 비용 가중치.
velocity_weight = 1.2
# 조향각 크기(rad^2)에 대한 페널티 비용 가중치. 과도한 대각 조향을 억제함.
steering_weight = 0.08
# 인접 예측 스텝 간 조향각 변화량에 대한 페널티 비용 가중치. 클수록 급격한 조향 진동을 억제하고 부드럽게 조향함.
steering_change_weight = 0.02
# 예측 궤적의 마지막 스텝(terminal) 위치와 전방 목표점(lookahead target) 사이의 종단 거리 오차 비용 가중치.
terminal_distance_weight = 2.0

[vlp-16]
ip = 192.168.100.3
port = 2368
min_angle = -90.0
max_angle = 90.0
# V2 URDF: base_link is 0.36 m above ground and VLP-16 is 0.25 m above base_link.
sensor_height_m = 0.61
offset_x = 1.015
offset_y = 0.0
pitch_deg = 15.0
# Only points at or above this ground-relative height are obstacles.
min_obstacle_height_m = 0.10
enable = true
#status = ip, port, packet_count, last_packet_time, last_point_count
status = last_point_count

[ouster-sr-128]
# Ouster sensor: 192.168.10.5; bind to this PC's receive address.
model = OS1
bind_ip = 192.168.10.2
port = 7502
metadata_path = mapping/ouster-sr-128.json
enable = true
status =

[telescopic_mast]
port = /dev/ttyS10
baudrate = 9600
parity = N
stopbits = 2
bus_address = 1
stop_trig_bound = 15.0
enable = true
status = current_height_mm, target_height_mm, mast_action_state, move_height_active

[synerex_syn2000]
port = /dev/ttyS4
baudrate = 115200
utc_offset = 9
update_interval_sec = 0.2
ws_host = 127.0.0.1
ws_port = 18765
enable = false
status = latitude, longitude, heading, fix_quality, satellites, new_updated

[synerex_syn3100]
# Configured for the Nuvo-10003 COM4 connection; verify the device path if NMEA is absent.
port = /dev/ttyUSB1
baudrate = 115200
update_interval_sec = 0.2
enable = true
status = latitude, longitude, heading, fix_quality, satellites, new_updated

[fluke_sv600]
host = 192.168.10.4
port = 80
username = admin
password = admin
frequency_ranges = 20000-28000
image_output_dir = datalog/fluke_sv600
api_port = 9011
capture_interval_sec = 1.0
enable = true
status = frame_count, frequency_ranges

[xsens_mti_630r]
# Select exactly one transport: rs232 or can.
interface = rs232
port = /dev/serial/by-id/usb-Xsens_MTi_USB_Converter_DB9YBFQF-if00-port0
baudrate = 115200
can_channel = 0
can_bitrate = 500000
# Optional CAN arbitration ID filter (decimal or 0x-prefixed hex).
can_message_id =
enable = true
#status = interface, port, baudrate, sample_count, timestamp, roll, pitch, yaw, acceleration, rate_of_turn
status = roll, pitch, yaw, acceleration, rate_of_turn

[tabos_bmu]
# Set port and add tabos_bmu to [PLATFORM] devices when the BMU is put into use.
port =
baudrate = 19200
word_length = 8
parity = N
flow_control = none
stop_bits = 1
poll_interval_sec = 1.0
enable = false
status = bytes_received, last_rx_timestamp

[DATA_LOGGER]
base_dir = /home/iae/dev/flame_robotics_patroller/APROS/datalog
record_interval_ms = 50
enable_camera = true
enable_vlp16 = true
enable_ouster = true
enable_can = true
enable_incline = true
enable_rtk = true

[mission_manager]
cpa_window_m = 2.0
cpa_tolerance_m = 0.35
enable = true


