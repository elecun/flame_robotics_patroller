<!DOCTYPE html>
<html>
<head>
    <title>APROS Patrol Location Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #10141f;
            overflow: hidden;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #10141f;
        }
        #coordOverlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.75);
            color: #00E676;
            padding: 4px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid rgba(0, 230, 118, 0.3);
            pointer-events: none;
        }
        #autoCenterBtn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            color: #00E676;
            border: 1px solid rgba(0, 230, 118, 0.5);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            user-select: none;
            transition: all 0.2s;
        }
        #autoCenterBtn:hover {
            background: rgba(0, 230, 118, 0.2);
        }
        #autoCenterBtn.off {
            color: #FFB300;
            border-color: rgba(255, 179, 0, 0.5);
        }
        #autoCenterBtn.off:hover {
            background: rgba(255, 179, 0, 0.2);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="coordOverlay">Lat: --, Lon: -- (Zoom: 18)</div>
    <button id="autoCenterBtn">🎯 현재위치 고정 ON</button>

    <script>
        (function() {
            var host = window.location.hostname || 'localhost';
            var assetServer = 'http://' + host + ':8082';

            // Dynamically inject CSS and JS relative to connecting Host IP
            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = assetServer + '/resource/leaflet.css';
            document.head.appendChild(css);

            var js = document.createElement('script');
            js.src = assetServer + '/resource/leaflet.js';
            document.head.appendChild(js);

            // Parse URL query parameters passed from Viser iframe (e.g. ?lat=34.7971754&lon=127.6607499&zoom=18)
            var urlParams = new URLSearchParams(window.location.search);
            var defaultLat = parseFloat(urlParams.get('lat')) || 34.7971754;
            var defaultLon = parseFloat(urlParams.get('lon')) || 127.6607499;
            var defaultZoom = parseInt(urlParams.get('zoom')) || 18;
            var wsPort = urlParams.get('ws_port') || '18765';

            var currentLat = defaultLat;
            var currentLon = defaultLon;
            var autoCenter = true;
            var map, marker;

            function setAutoCenter(enabled) {
                autoCenter = enabled;
                var btn = document.getElementById('autoCenterBtn');
                if (enabled) {
                    btn.className = '';
                    btn.innerHTML = '🎯 현재위치 고정 ON';
                    if (map) {
                        map.setView([currentLat, currentLon], map.getZoom(), {animate: false});
                    }
                } else {
                    btn.className = 'off';
                    btn.innerHTML = '🎯 위치 고정 해제됨 (클릭 시 고정)';
                }
            }

            function initMap() {
                if (typeof L === 'undefined') {
                    setTimeout(initMap, 100);
                    return;
                }

                map = L.map('map').setView([defaultLat, defaultLon], defaultZoom);
                window.map = map;

                L.tileLayer(assetServer + '/maptile/{z}/{x}/{y}.png', {
                    minZoom: 15,
                    maxZoom: 19,
                    attribution: 'Local Patrol Map',
                    errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='
                }).addTo(map);

                var robotIcon = L.divIcon({
                    className: 'apros-robot-marker',
                    html: '<div style="width:10px; height:10px; background:#00E676; border:2px solid #FFF; border-radius:50%; box-shadow:0 0 8px #00E676;"></div>',
                    iconSize: [10, 10],
                    iconAnchor: [5, 5]
                });

                marker = L.marker([defaultLat, defaultLon], {icon: robotIcon}).addTo(map);
                marker.bindPopup('<b>APROS Patrol Robot</b><br>Lat: ' + defaultLat.toFixed(6) + '<br>Lon: ' + defaultLon.toFixed(6));

                var coordOverlay = document.getElementById('coordOverlay');
                function updateCoordDisplay() {
                    var center = map.getCenter();
                    var zoom = map.getZoom();
                    coordOverlay.innerHTML = 'Lat: ' + center.lat.toFixed(6) + ', Lon: ' + center.lng.toFixed(6) + ' (Zoom: ' + zoom + ')';
                }
                map.on('move', updateCoordDisplay);
                map.on('zoomend', updateCoordDisplay);
                
                // If user manually drags the map, temporarily disable auto-center
                map.on('dragstart', function() {
                    setAutoCenter(false);
                });

                document.getElementById('autoCenterBtn').addEventListener('click', function() {
                    setAutoCenter(!autoCenter);
                });

                updateCoordDisplay();
                connectWS();
            }

            function connectWS() {
                var wsUrl = 'ws://' + host + ':' + wsPort;
                var ws = new WebSocket(wsUrl);

                ws.onmessage = function(evt) {
                    try {
                        var data = JSON.parse(evt.data);
                        var lat = data.latitude !== undefined ? data.latitude : data.lat;
                        var lon = data.longitude !== undefined ? data.longitude : data.lon;
                        if (lat !== undefined && lon !== undefined) {
                            currentLat = lat;
                            currentLon = lon;
                            marker.setLatLng([lat, lon]);
                            if (autoCenter) {
                                map.setView([lat, lon], map.getZoom(), {animate: false});
                            }
                            marker.getPopup().setContent('<b>APROS Patrol Robot</b><br>Lat: ' + lat.toFixed(6) + '<br>Lon: ' + lon.toFixed(6) + '<br>Status: ' + (data.status || 'FIX_RTK'));
                        }
                    } catch(e) {}
                };

                ws.onerror = ws.onclose = function() {
                    if (marker && map) {
                        currentLat = defaultLat;
                        currentLon = defaultLon;
                        marker.setLatLng([defaultLat, defaultLon]);
                        if (autoCenter) {
                            map.setView([defaultLat, defaultLon], map.getZoom(), {animate: false});
                        }
                    }
                    setTimeout(connectWS, 3000);
                };
            }

            initMap();
        })();
    </script>
</body>
</html>
